<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mobile Fullscreen Test</title>
<style>
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#111;
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:white;
  }
  #app{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    text-align:center;
    padding:20px;
    box-sizing:border-box;
    background:linear-gradient(#4aa3df,#7bd36a);
  }
  button{
    font-size:24px;
    padding:16px 28px;
    border:0;
    border-radius:14px;
    cursor:pointer;
  }
  #status{
    font-size:14px;
    line-height:1.5;
    background:rgba(0,0,0,.45);
    padding:12px 16px;
    border-radius:10px;
    max-width:90vw;
    white-space:pre-line;
  }
  #box{
    width:80vw;
    height:24vh;
    border:4px dashed white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    box-sizing:border-box;
  }
</style>
</head>
<body>
<div id="app">
  <h1>Fullscreen Test</h1>
  <button id="fs">ENTER FULLSCREEN</button>
  <div id="box">If fullscreen works, browser bars should disappear.</div>
  <div id="status"></div>
</div>

<script>
const statusEl = document.getElementById('status');

function fsElement(){
  return document.fullscreenElement ||
         document.webkitFullscreenElement ||
         document.msFullscreenElement || null;
}

function update(){
  const vv = window.visualViewport;
  statusEl.textContent =
`fullscreen: ${!!fsElement()}
inner: ${window.innerWidth} × ${window.innerHeight}
visualViewport: ${vv ? Math.round(vv.width)+' × '+Math.round(vv.height) : 'n/a'}
screen: ${screen.width} × ${screen.height}
orientation: ${screen.orientation ? screen.orientation.type : 'n/a'}`;
}

async function enterFullscreen(){
  const el = document.documentElement;
  const request =
    el.requestFullscreen ||
    el.webkitRequestFullscreen ||
    el.msRequestFullscreen;

  if (!request) {
    alert('Fullscreen API is not available in this browser.');
    return;
  }

  try {
    await request.call(el);

    try {
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock('landscape');
      }
    } catch(e) {}

    setTimeout(update, 150);
  } catch (e) {
    alert('Fullscreen request failed: ' + e);
    update();
  }
}

document.getElementById('fs').addEventListener('click', enterFullscreen);
document.addEventListener('fullscreenchange', update);
document.addEventListener('webkitfullscreenchange', update);
window.addEventListener('resize', update);
window.addEventListener('orientationchange', () => setTimeout(update, 150));

update();
</script>
</body>
</html>
